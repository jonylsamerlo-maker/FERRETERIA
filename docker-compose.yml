version: '3.8'

services:
  # Servidor de Astro (React)
  frontend:
    build:
      context: ./ferreteria-jm/apps/frontend
      dockerfile: dockerfile
    ports:
      - "4321:4321"
    volumes:
      - ./ferreteria-jm/apps/frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:8081}
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://backend}
      - SITE_URL=${SITE_URL:-}
    command: >
      sh -c "npm run astro -- dev stop || true && npm run dev"

  # Servidor PHP (Backend)
  backend:
    image: php:8.2-apache
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/config/php-security.ini:/usr/local/etc/php/conf.d/security.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-development}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:4321}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - DB_HOST=db
      - DB_NAME=${MYSQL_DATABASE:-ferreteria_db}
      - DB_USER=${MYSQL_USER:-jony_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-jony_password}
    depends_on:
      - db # Espera a que la base de datos esté lista
    # Instalamos la extensión PDO de MySQL para que PHP pueda conectarse orientada a objetos
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql && apache2-foreground"

  # Base de datos MySQL
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ferreteria_db}
      MYSQL_USER: ${MYSQL_USER:-jony_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jony_password}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  db_data:
