<VirtualHost *:80>
    DocumentRoot /var/www/html

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/api>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/img>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
